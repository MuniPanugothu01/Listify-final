# ═══════════════════════════════════════════════════════════════════
# Listify — Nginx Production Configuration
#
# Responsibilities:
#   1. Serve the Vite-built SPA (index.html + hashed assets)
#   2. Reverse-proxy /api/* requests to the backend container
#   3. HTTPS termination via Let's Encrypt (Certbot)
#   4. HTTP → HTTPS redirect in production
#   5. Production-grade caching, compression & security headers
#
# Modes:
#   • Production (HTTPS): port 80 redirects → 443, SSL via Certbot
#   • Development (HTTP):  port 80 only, no SSL
# ═══════════════════════════════════════════════════════════════════

# ---------- Upstreams ----------
upstream api_backend {
    # Docker Compose service name resolves via internal DNS
    server api:5000;

    # Keep-alive pool — reuse TCP connections to the backend
    keepalive 32;
}

# ══════════════════════════════════════════════════════════════════
# Server Block 1 — HTTP (port 80)
#
# In production: serves ONLY the ACME challenge for Certbot,
#   then 301-redirects everything else to HTTPS.
# In development: serves the full site on HTTP (no SSL needed).
# ══════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # ── Let's Encrypt ACME challenge (always available) ───────────
    # Certbot writes challenge files here for domain verification.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # ── Production: redirect HTTP → HTTPS ─────────────────────────
    # If SSL cert exists, redirect all traffic to HTTPS.
    # If cert doesn't exist yet (first deploy), fall through to
    # serve the site on HTTP so Certbot can obtain the cert.
    set $redirect_to_https 0;
    if (-f /etc/letsencrypt/live/${DOMAIN}/fullchain.pem) {
        set $redirect_to_https 1;
    }
    if ($redirect_to_https = 1) {
        return 301 https://$host$request_uri;
    }

    # ── Fallback: serve site on HTTP (dev or pre-cert production) ─
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/static-assets.conf;
    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/spa-fallback.conf;
}

# ══════════════════════════════════════════════════════════════════
# Server Block 2 — HTTPS (port 443) — Production only
#
# This block is only active when SSL certificates exist.
# It provides full TLS 1.2/1.3 encryption with A+ SSL Labs rating.
# ══════════════════════════════════════════════════════════════════
server {
    listen 443 ssl http2;
    server_name ${DOMAIN} www.${DOMAIN};

    # ── SSL Certificate (Let's Encrypt via Certbot) ───────────────
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # ── SSL Hardening (A+ rating on SSL Labs) ─────────────────────
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling — faster TLS handshake, no extra round-trip
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # SSL session caching — reuse TLS sessions across connections
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # DH parameters for stronger key exchange (generated at build)
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ── HSTS — force browsers to always use HTTPS ─────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/static-assets.conf;
    include /etc/nginx/snippets/api-proxy.conf;
    include /etc/nginx/snippets/spa-fallback.conf;
}
