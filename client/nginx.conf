# ═══════════════════════════════════════════════════════════════════
# Listify — Nginx Production Configuration
#
# Responsibilities:
#   1. Serve the Vite-built SPA (index.html + hashed assets)
#   2. Reverse-proxy /api/* requests to the backend container
#   3. Production-grade caching, compression & security headers
# ═══════════════════════════════════════════════════════════════════

# ---------- Upstreams ----------
upstream api_backend {
    # Docker Compose service name resolves via internal DNS
    server api:5000;

    # Keep-alive pool — reuse TCP connections to the backend
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"           always;
    add_header X-Content-Type-Options     "nosniff"              always;
    add_header X-XSS-Protection           "1; mode=block"        always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip — compress text-based assets on the fly ──────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Static Assets (Vite hashed filenames → immutable cache) ───
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicons, manifest, robots — cache for a day
    location ~* \.(ico|svg|png|webp|json|xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── API Reverse Proxy ─────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;

        # Keep-alive to upstream
        proxy_set_header Connection        "";

        # Forward client identity
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cookie handling
        proxy_set_header Cookie            $http_cookie;
        proxy_pass_header Set-Cookie;

        # Timeouts (generous for image uploads)
        proxy_connect_timeout  10s;
        proxy_read_timeout     120s;
        proxy_send_timeout     120s;

        # Upload limit (6 images × ~10 MB each + overhead)
        client_max_body_size 70m;

        # No caching for API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ── Health endpoint (for Docker/ALB health checks) ────────────
    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── SPA Fallback (React Router) ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html itself (so deploys take effect immediately)
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }

    # ── Error pages ──────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Block dotfiles (.env, .git, etc.) ─────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
