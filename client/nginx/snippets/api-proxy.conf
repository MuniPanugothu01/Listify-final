# ═══════════════════════════════════════════════════════════════════
# API Reverse Proxy — shared between HTTP and HTTPS server blocks
# ═══════════════════════════════════════════════════════════════════

location /api/ {
    proxy_pass         http://api_backend;
    proxy_http_version 1.1;

    # Keep-alive to upstream
    proxy_set_header Connection        "";

    # Forward client identity
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cookie handling
    proxy_set_header Cookie            $http_cookie;
    proxy_pass_header Set-Cookie;

    # Timeouts (generous for image uploads)
    proxy_connect_timeout  10s;
    proxy_read_timeout     120s;
    proxy_send_timeout     120s;

    # Upload limit (6 images × ~10 MB each + overhead)
    client_max_body_size 70m;

    # No caching for API responses
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# Health endpoint (for Docker/ALB health checks)
location /health {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}
