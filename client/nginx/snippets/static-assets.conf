# ═══════════════════════════════════════════════════════════════════
# Static Asset Caching — shared between HTTP and HTTPS server blocks
# ═══════════════════════════════════════════════════════════════════

# Vite hashed filenames → immutable cache (1 year)
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Favicons, manifest, robots — cache for a day
location ~* \.(ico|svg|png|webp|json|xml|txt)$ {
    expires 1d;
    add_header Cache-Control "public, no-transform";
    access_log off;
}
