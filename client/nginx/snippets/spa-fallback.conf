# ═══════════════════════════════════════════════════════════════════
# SPA Fallback + Error Pages — shared between HTTP and HTTPS
# ═══════════════════════════════════════════════════════════════════

# React Router — all unknown paths → index.html
location / {
    try_files $uri $uri/ /index.html;

    # Don't cache index.html itself (so deploys take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# Error pages
error_page 404 /index.html;
error_page 500 502 503 504 /50x.html;

location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}

# Block dotfiles (.env, .git, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
