# ═══════════════════════════════════════════════════════════════════
# Gzip Compression — shared between HTTP and HTTPS server blocks
# ═══════════════════════════════════════════════════════════════════
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;
